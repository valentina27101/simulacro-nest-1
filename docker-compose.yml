services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solicitudes-api
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      - PORT=${PORT:-3002}
      - API_KEYS=${API_KEYS:-clave-prueba-1,clave-prueba-2}
      - DB_PATH=${DB_PATH:-data/solicitudes.sqlite}
    env_file:
      - path: .env
        required: false
    volumes:
      # Volumen para persistir la base de datos SQLite
      - sqlite_data:/usr/src/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/docs >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    name: solicitudes_sqlite_data

